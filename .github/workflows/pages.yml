# Test, build and publish the game to GitHub Pages, then check the live site and ping IndexNow.
# Fails safe: a failed type check, unit test, page test or scripted playthrough stops before the deploy,
# so the last good site stays live. Safe to re-run at any time.
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "tests/**"
      - "site.json"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # The one address setting. Set the repository variable SITE_URL to move the site to a custom domain.
  SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
  STAGED: ${{ vars.STAGED }}
  SUPPORT_URL: ${{ vars.SUPPORT_URL }}
  SUPPORT_LABEL: ${{ vars.SUPPORT_LABEL }}
  GOATCOUNTER_URL: ${{ vars.GOATCOUNTER_URL }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the sitemap's lastmod comes from git
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Type check and unit tests
        run: npm run typecheck && npm run test:unit
      - name: Build
        run: npm run build
      - name: Rendered-HTML tests
        run: npm run test:html
      - name: Scripted playthrough in headless Chrome
        run: npm run e2e
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - uses: actions/upload-artifact@v7
        with:
          name: urls
          path: dist/urls.txt
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  after-deploy:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: urls
      - name: The new build is live and healthy
        run: node scripts/check-live.mjs "$SITE_URL" --expect-build "$GITHUB_SHA" --wait 600
      - name: Scripted playthrough on the live site
        run: |
          for attempt in 1 2 3; do
            node scripts/e2e.mjs "$SITE_URL/" && exit 0
            sleep 45
          done
          exit 1
      - name: Tell search engines (IndexNow)
        run: node scripts/indexnow.mjs urls.txt
